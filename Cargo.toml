[workspace]
resolver = "3"
members = [
    "crates/rivet-core",
    "crates/rivet-runtime",
    "crates/rivet-session",
    "crates/rivet-task",
    "crates/rivet-plugin",
    "crates/rivet-tui",
    "crates/rivet-cli",
    "plugins/model-openai",
    "plugins/tool-filesystem",
    "plugins/tool-shell",
    "plugins/tool-git",
    "plugins/policy-default",
    "plugins/sandbox-local",
    "examples/minimal-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/kangwoo/rivet"
authors = ["Rivet contributors"]

[workspace.dependencies]
# internal
rivet-core = { path = "crates/rivet-core", version = "0.1.0" }
rivet-runtime = { path = "crates/rivet-runtime", version = "0.1.0" }
rivet-session = { path = "crates/rivet-session", version = "0.1.0" }
rivet-task = { path = "crates/rivet-task", version = "0.1.0" }
rivet-plugin = { path = "crates/rivet-plugin", version = "0.1.0" }
rivet-tui = { path = "crates/rivet-tui", version = "0.1.0" }

rivet-model-openai = { path = "plugins/model-openai", version = "0.1.0" }
rivet-tool-filesystem = { path = "plugins/tool-filesystem", version = "0.1.0" }
rivet-tool-shell = { path = "plugins/tool-shell", version = "0.1.0" }
rivet-tool-git = { path = "plugins/tool-git", version = "0.1.0" }
rivet-policy-default = { path = "plugins/policy-default", version = "0.1.0" }
rivet-sandbox-local = { path = "plugins/sandbox-local", version = "0.1.0" }

# external
async-trait = "0.1"
futures-core = "0.3"
globset = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
eventsource-stream = "0.2"
ratatui = "0.29"
crossterm = "0.29"
tempfile = "3"
pretty_assertions = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
