# Rivet configuration. Place at the workspace root as `rivet.toml`.

[agent]
model = "deepseek/deepseek-chat"

# Hard stops. Each exists because its absence has burned someone.
[agent.limits]
max_turns                   = 50
max_duration_ms             = 1_800_000    # 30 min
max_total_tokens            = 2_000_000
max_context_tokens          = 128_000
max_consecutive_tool_errors = 5

[workspace]
# Inside the workspace but never readable or writable.
#
# Patterns are globs matched against the workspace-relative path, case-insensitively.
# A bare name applies at any depth: `.env` also covers `sub/.env`.
# A malformed pattern fails at startup rather than silently protecting nothing.
#
# `.git/config` is here because core.fsmonitor and core.pager are arbitrary
# code execution paths: write access to git config is shell access.
deny = [".env", ".git/config", ".ssh", "**/credentials.json", "**/*.pem"]

# Since Phase 2 there is no middle category: an id here either loads or is a typo, and a
# typo fails at startup listing the ids this build provides. `rivet.tool-shell`,
# `rivet.tool-git`, `rivet.policy-default` and `rivet.sandbox-local` are therefore *not*
# listed until Phase 4 ships them -- a plugin that registers nothing would only lie to
# `rivet plugin list`.
#
# Leaving this key out (or empty) means the *default selection* -- what it takes to run an
# agent -- which is what makes `rivet "explain this repo"` work with no configuration file
# at all. It does not mean "every plugin this build provides": `rivet.telemetry-log` is in
# the catalog and outside the default, because a log collector should not switch itself on
# for somebody who never wrote a config.
#
# `rivet.context-builtin` (the system-prompt and workspace providers) is always registered:
# the loop cannot assemble a request without it, so it is not an option to switch off.
#
# `rivet plugin list` prints what this build has; `rivet plugin show <id>` prints one
# plugin's manifest and the permissions the active profile leaves it.
[plugins]
enabled = [
    "rivet.model-openai",
    "rivet.tool-filesystem",
    # Structured logs from the event bus, through `tracing`. In the catalog, out of the
    # default selection -- uncomment to switch it on. Note that this file only reaches
    # somebody who already has an explicit `enabled` list; what keeps it off for everyone
    # else is `catalog::default_selection`, not this comment.
    #
    #   RIVET_LOG_FORMAT=json rivet "explain this repo" 2>telemetry.jsonl
    #
    # "rivet.telemetry-log",
]

[plugins."rivet.model-openai"]
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"        # the key itself never goes in this file

# [plugins."rivet.telemetry-log"]
# The prefixes to subscribe to. Omit for the default, which deliberately leaves out
# `agent.text.` -- the model's output, verbatim.
# topics = ["agent.run.", "agent.turn.", "agent.request.", "tool.", "plugin.", "runtime."]
# level = "info"                        # trace | debug | info | warn
#
# Put the whole conversation in the log. `false` means it is not even subscribed to:
# counting the deltas would mean receiving them, and receiving them means they exist
# somewhere. A profile that withholds `agent.text.` refuses to load with this on, rather
# than quietly logging less than it was told to.
# include_conversation = false

# In Phase 1 a profile narrows the agent's *tool scope* -- which tools are registered and
# therefore offered to the model. That is pipeline step 2, not policy enforcement: the
# policy chain, approvals and sandboxing arrive in Phase 4. `readonly` really does mean the
# model is never given `write_file`; it does not yet mean a policy would stop it.
[policy]
profile = "developer"    # developer | readonly | reviewer | ci | production

[sandbox]
provider = "local"       # local | docker | podman
# Check `guarantees()` output: `local` isolates nothing and says so.
# The runtime always calls teardown(); a sandbox is never released by Drop alone.

[job]
workflow        = "review-gate"
max_attempts    = 3
max_concurrency = 1      # see architecture.md open question §11-5

# A reviewer is a normal agent with a different model and no write tools.
# A reviewer that can edit the code is not a reviewer.
#
# Phase 1 parses this section and reports it in `rivet doctor`, but has no command-line
# surface for selecting a named agent, so nothing here takes effect yet. Note that
# `context_providers` names a `job` and a `git` provider that do not exist until later
# phases; Phase 1 registers `system` and `workspace`.
[agents.reviewer]
model             = "anthropic/claude-sonnet-5"
tools             = ["read_file", "list_dir", "git_diff", "git_log"]
profile           = "reviewer"
context_providers = ["system", "job", "git"]
