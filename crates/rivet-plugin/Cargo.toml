[package]
name = "rivet-plugin"
description = "Plugin discovery, manifest parsing, lifecycle and rollback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rivet-core.workspace = true
async-trait.workspace = true
# `catch_unwind` on the `load` future: a panicking plugin must roll back like a failing
# one rather than take the process with it.
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
rivet-runtime.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
pretty_assertions.workspace = true

[lints]
workspace = true
