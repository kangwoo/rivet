[package]
name = "rivet-tool-shell"
description = "Shell tool for Rivet, executed through a sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rivet-core.workspace = true
# For `argv`: every model-supplied string reaches argv through a door that cannot make it a
# flag. The same edge `tool-filesystem` has for `fsguard`, and for the same kind of reason.
rivet-runtime.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }

[dev-dependencies]
rivet-plugin.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true

[lints]
workspace = true
