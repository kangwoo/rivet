[package]
name = "rivet-tool-filesystem"
description = "Filesystem tools for Rivet: read, write, list, search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rivet-core.workspace = true
# For `fsguard`: every path these tools open is re-verified after the open. The plan puts
# that module in `rivet-runtime`, which is what creates this edge.
rivet-runtime.workspace = true
async-trait.workspace = true
globset.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
