[package]
name = "rivet-sandbox-local"
description = "Local (unconfined) sandbox provider for Rivet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rivet-core.workspace = true
# For `fsguard::resolve_dir`: a child's `cwd` is re-checked after canonicalizing it, which
# is the same edge `tool-filesystem` already has and for the same reason.
rivet-runtime.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# One call, `kill_process_group`, in a safe wrapper. Same shape as `rivet-runtime`'s use of
# `libc` for `O_NOFOLLOW`: a platform constant behind a safe API, not an `unsafe` block.
rustix.workspace = true

[dev-dependencies]
rivet-plugin.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
