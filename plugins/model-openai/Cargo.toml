[package]
name = "rivet-model-openai"
description = "OpenAI-compatible model plugin (OpenAI, DeepSeek, Ollama, vLLM, OpenRouter)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rivet-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
reqwest.workspace = true
eventsource-stream.workspace = true
futures-util.workspace = true
jiff.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# `net` is not in the workspace tokio feature list; the loopback tests below need a
# real listener and must not depend on another crate's features unifying it in.
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }
tempfile.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
