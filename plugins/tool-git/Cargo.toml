[package]
name = "rivet-tool-git"
description = "Git tools for Rivet: status, diff, log, commit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rivet-core.workspace = true
# For `fsguard`: a `path` argument is resolved and re-checked before it reaches argv, the
# same edge `tool-filesystem` has and for the same reason.
rivet-runtime.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }

[dev-dependencies]
rivet-plugin.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true

[lints]
workspace = true
