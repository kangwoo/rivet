name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Not `rustsec/audit-check`: it installs cargo-audit without `--locked`, so cargo
      # resolves cargo-audit's own dependencies to their newest versions and the build
      # fails the moment one of them raises its MSRV past ours.
      #
      # Two overrides are needed on top of `--locked`. `rust-toolchain.toml` pins this
      # repository to 1.90 and applies to any cargo run inside the checkout, including
      # this one, so `RUSTUP_TOOLCHAIN` steps around it -- the tool is not our code and
      # does not belong under our MSRV. And this workflow sets `RUSTFLAGS: -D warnings`
      # globally, which would fail the build on a warning in somebody else's crate.
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
        env:
          RUSTUP_TOOLCHAIN: stable
          RUSTFLAGS: ""

      - name: Audit
        run: cargo audit
        env:
          RUSTUP_TOOLCHAIN: stable
          RUSTFLAGS: ""
